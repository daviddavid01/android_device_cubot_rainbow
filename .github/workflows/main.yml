name: Build Huawei Y3 CRO-U00 zImage (Fixed Container)

on:
  workflow_dispatch: # Allows manual trigger via a button on GitHub
  push:
    branches: [ main, master ]

jobs:
  build-zimage:
    runs-on: ubuntu-24.04 # Use standard host runner to prevent execution crashes

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4 # Safely checks out code outside the broken container runtime

      - name: Compile Inside Vintage Environment
        run: |
          # Use docker run directly to isolate ONLY the compilation step
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:16.04 bash -c "
            # 1. Update and install compilation tools inside the environment
            apt-get update && apt-get install -y bc build-essential libncurses5-dev libssl-dev flex bison libelf-dev libxml2-utils lzma xz-utils git

            # 2. Grab the specific toolchain needed for MediaTek 3.18.19
            git clone --depth=1 https://googlesource.com toolchain

            # 3. Setup compiler flags
            export ARCH=arm
            export CROSS_COMPILE=/workspace/toolchain/bin/arm-linux-androideabi-

            # 4. Process configuration file
            if [ -f arch/arm/configs/cairo_defconfig ]; then
              make cairo_defconfig
            elif [ -f arch/arm/configs/cro_u00_defconfig ]; then
              make cro_u00_defconfig
            else
              make mt6580_defconfig
            fi

            # 5. Compile the target binary
            make -j\$(nproc) zImage
          "

      - name: Upload Finished zImage
        uses: actions/upload-artifact@v4
        with:
          name: CRO-U00-zImage
          path: arch/arm/boot/zImage
