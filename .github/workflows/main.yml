name: Build Huawei Y3 CRO-U00 zImage (All Steps in Container)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Run Full Pipeline inside Vintage Environment
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:16.04 bash -c "
            echo '==================================================='
            echo 'STEP 1: Installing Vintage Era Dependencies'
            echo '==================================================='
            apt-get update
            apt-get install -y bc build-essential libncurses5-dev libssl-dev flex bison libelf-dev libxml2-utils lzma xz-utils git

            echo '==================================================='
            echo 'STEP 2: Clonging Legacy GCC 4.9 Toolchain'
            echo '==================================================='
            git clone --depth=1 https://googlesource.com /workspace/toolchain

            echo '==================================================='
            echo 'STEP 3: Configuring Environment & Defconfig'
            echo '==================================================='
            export ARCH=arm
            export CROSS_COMPILE=/workspace/toolchain/bin/arm-linux-androideabi-

            if [ -f arch/arm/configs/cairo_defconfig ]; then
              echo 'Found cairo_defconfig'
              make cairo_defconfig
            elif [ -f arch/arm/configs/cro_u00_defconfig ]; then
              echo 'Found cro_u00_defconfig'
              make cro_u00_defconfig
            else
              echo 'Falling back to mt6580_defconfig'
              make mt6580_defconfig
            fi

            echo '==================================================='
            echo 'STEP 4: Compiling zImage Kernel Binary'
            echo '==================================================='
            make -j\$(nproc) zImage
          "

      - name: Upload Finished zImage
        uses: actions/upload-artifact@v4
        with:
          name: CRO-U00-zImage
          path: arch/arm/boot/zImage
